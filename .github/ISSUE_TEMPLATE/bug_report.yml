name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping Nolithium get better. Please don't paste private notes; a short made-up example is enough.
  - type: input
    id: version
    attributes:
      label: Nolithium version
      description: Shown at the bottom of the palette panel (top right of the window).
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a note
        2. …
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Desk and tiles, Editor and formatting, Opening files (Open with), Saving or lost notes, Updates or installer, Appearance, Other]
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
