[package]
name = "nolithium"
version = "0.3.0"
description = "A quiet glass desk for notes"
authors = ["Murat Emre Biçici"]
license = "MIT"
repository = "https://github.com/MuratBicici/Nolithium"
edition = "2021"

[lib]
name = "nolithium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
encoding_rs = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
